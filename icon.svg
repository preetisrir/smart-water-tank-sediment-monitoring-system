<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sedimentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Water Tank Outer Chamber Silhouette -->
  <rect x="136" y="100" width="240" height="290" rx="36" fill="#0f172a" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Water Level Fill inside Chamber -->
  <path d="M 140 240 Q 196 220, 256 240 T 372 240 L 372 354 Q 372 386, 340 386 L 172 386 Q 140 386, 140 354 Z" fill="url(#dropGrad)" fill-opacity="0.35"/>

  <!-- Water Droplet Main Mark -->
  <path d="M 256 90 C 256 90, 160 216, 160 294 C 160 348, 203 392, 256 392 C 309 392, 352 348, 352 294 C 352 216, 256 90, 256 90 Z" fill="url(#dropGrad)" filter="url(#glow)"/>

  <!-- Droplet Gloss Highlight -->
  <path d="M 226 180 C 212 210, 196 250, 196 284 C 196 304, 206 322, 218 334 C 212 320, 208 300, 208 280 C 208 244, 222 210, 234 186 Z" fill="#ffffff" fill-opacity="0.45"/>

  <!-- Water Ripple / Wave Inside Droplet -->
  <path d="M 176 300 Q 216 280, 256 300 T 336 300 L 336 314 Q 296 294, 256 314 T 176 314 Z" fill="url(#waveGrad)"/>

  <!-- Sediment Layer at Bottom of Droplet / Tank -->
  <path d="M 186 348 Q 256 340, 326 348 C 314 372, 287 388, 256 388 C 225 388, 198 372, 186 348 Z" fill="url(#sedimentGrad)"/>

  <!-- Smart Monitoring Waves (Antenna / Telemetry Pulse) -->
  <circle cx="256" cy="74" r="14" fill="#38bdf8"/>
  <path d="M 230 64 A 32 32 0 0 1 282 64" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 216 52 A 52 52 0 0 1 296 52" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Safe Limit Sensor Laser Baseline -->
  <line x1="168" y1="334" x2="344" y2="334" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="6 4"/>
  <circle cx="256" cy="334" r="4" fill="#fbbf24"/>

  <!-- Base Stand -->
  <path d="M 196 422 L 316 422 L 304 438 L 208 438 Z" fill="#64748b"/>
</svg>
